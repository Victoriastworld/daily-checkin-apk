name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install dependencies
      run: npm install
    
    - name: Verify Capacitor CLI
      run: |
        echo "=== Checking capacitor CLI ==="
        npx cap --version || npm list @capacitor/cli
    
    - name: Build web app
      run: npm run build
    
    - name: Verify dist folder
      run: |
        echo "=== Checking dist folder ==="
        ls -la dist/ || echo "dist folder not found"
        cat dist/index.html 2>/dev/null || echo "No index.html"
    
    - name: Sync to Android
      run: |
        echo "=== Syncing to Android ==="
        npx cap sync android
    
    - name: Verify sync result
      run: |
        echo "=== Checking android assets ==="
        ls -la android/app/src/main/assets/public/ || echo "assets not found"
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
    
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: daily-checkin-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
