name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install npm dependencies
      run: npm install

    - name: Build web app
      run: npm run build

    - name: Sync to Android
      run: npx cap sync android

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Rename APK to Future.apk
      run: cp android/app/build/outputs/apk/debug/app-debug.apk Future.apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Future
        path: Future.apk

    - name: Deploy APK to GitHub Pages (public download)
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: .
        publish_branch: gh-pages
        keep_files: true
        exclude_assets: ''