name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install dependencies
      run: npm install
    
    - name: Check project structure
      run: |
        echo "=== Project Structure ==="
        ls -la
        echo ""
        echo "=== Package.json ==="
        cat package.json
        echo ""
        echo "=== Android folder ==="
        ls -la android/ || echo "android folder not found"
    
    - name: Build web app
      run: npm run build
    
    - name: Sync to Android (with debug)
      run: |
        echo "=== Checking dist folder ==="
        ls -la dist/
        echo ""
        echo "=== Running cap sync ==="
        npx cap sync android 2>&1 || {
          echo "=== Cap sync failed, exit code: $? ==="
          cat capacitor.config.ts 2>/dev/null || echo "No capacitor.config.ts found"
          exit 1
        }
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
    
    - name: Build APK
      run: |
        echo "=== Assets folder ==="
        ls -la android/app/src/main/assets/
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: daily-checkin-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
